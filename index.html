<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ❤️ Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        // ============================================
        // ልብ ቅርፅ "I Love You" አኒሜሽን
        // ============================================

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // ካንቫሱን ወደ ሙሉ ስክሪን እናደርጋለን
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // የልብ ቅርፅ ነጥቦችን የሚሰላው ፎርሙላ
        // የልብ ፓራሜትሪክ እኩልነት:
        // x = 16 * sin³(t)
        // y = 13*cos(t) - 5*cos(2t) - 2*cos(3t) - cos(4t)
        function heartX(t, scale) {
            return scale * 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t, scale) {
            return scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        }

        // የልብ ቅርፅ ላይ ያሉ ነጥቦችን ያመነጫል
        function generateHeartPoints(numPoints, scale) {
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const t = (2 * Math.PI * i) / numPoints;
                points.push({
                    x: heartX(t, scale),
                    y: -heartY(t, scale)  // ወደ ላይ ለማድረግ አሉታዊ
                });
            }
            return points;
        }

        // ============================================
        // ዋና አኒሜሽን ተለዋዋጮች
        // ============================================
        const numPoints = 200;       // በልብ ዙሪያ ያሉ ነጥቦች ብዛት
        const text = "I LOVE YOU";
        let rotationAngle = 0;
        let time = 0;

        // ልብ ውስጥ የሚሞሉ ጽሁፎች (ተጨማሪ ቃላት)
        const heartWords = [
            "❤️", "I LOVE YOU", "💕", "I LOVE YOU", "💖",
            "I LOVE YOU", "💗", "I LOVE YOU", "💝"
        ];

        // ============================================
        // የእያንዳንዱን "I LOVE YOU" የሚይዝ ክላስ
        // ============================================
        class TextParticle {
            constructor(x, y, text, size, hue) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.text = text;
                this.size = size;
                this.hue = hue;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 5;
                this.speed = 0.5 + Math.random() * 0.5;
                this.offsetX = 0;
                this.offsetY = 0;
                this.phase = Math.random() * Math.PI * 2;
            }

            update(time) {
                // ትንሽ መንቀጥቀጥ እንዲኖር
                this.offsetX = Math.sin(time * 0.02 + this.phase) * 2;
                this.offsetY = Math.cos(time * 0.02 + this.phase) * 2;

                // የሚሽከረከር እንቅስቃሴ
                const rotX = this.targetX * Math.cos(rotationAngle) - this.targetY * Math.sin(rotationAngle);
                const rotY = this.targetX * Math.sin(rotationAngle) + this.targetY * Math.cos(rotationAngle);

                this.x = rotX + this.offsetX;
                this.y = rotY + this.offsetY;
            }

            draw(ctx, centerX, centerY) {
                const x = centerX + this.x;
                const y = centerY + this.y;
                const alpha = 0.7 + 0.3 * Math.sin(time * 0.03 + this.phase);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotationAngle * 0.3);

                ctx.font = `bold ${this.size}px Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // የጽሁፍ ብርሀን ውጤት (glow effect)
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 15;

                // ዋናው ጽሁፍ
                ctx.fillStyle = `hsla(${this.hue}, 100%, ${60 + 20 * Math.sin(time * 0.02 + this.phase)}%, ${alpha})`;
                ctx.fillText(this.text, 0, 0);

                // ነጭ ዙር (outline)
                ctx.shadowBlur = 0;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                ctx.lineWidth = 1;
                ctx.strokeText(this.text, 0, 0);

                ctx.restore();
            }
        }

        // ============================================
        // የልብ ውስጥ ያሉ ጽሁፎች (inner text particles)
        // ============================================
        class InnerParticle {
            constructor() {
                // በልብ ውስጥ በዘፈቀደ ቦታ
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 0.6; // ከልብ መሃል እስከ 60%
                this.speed = 0.002 + Math.random() * 0.005;
                this.hue = 330 + Math.random() * 40;
                this.size = 8 + Math.random() * 14;
                this.phase = Math.random() * Math.PI * 2;
                this.text = text[Math.floor(Math.random() * text.length)] || "I";
                this.driftAngle = Math.random() * Math.PI * 2;
                this.driftSpeed = 0.001 + Math.random() * 0.003;
            }

            update(scale) {
                // በልብ ውስጥ ይንቀሳቀሳል
                this.angle += this.speed;
                this.driftAngle += this.driftSpeed;

                // የልብ ቅርፅ ውስጥ እንዲሆን ማስላት
                const r = this.radius + 0.15 * Math.sin(time * 0.01 + this.phase);
                const t = this.angle + rotationAngle * 0.2;

                // የልብ ቅርፅ መጠን
                const hx = heartX(t, scale * r);
                const hy = -heartY(t, scale * r);

                this.x = hx;
                this.y = hy;

                // ትንሽ መንሸራተት
                this.x += Math.sin(time * 0.01 + this.driftAngle) * 5;
                this.y += Math.cos(time * 0.01 + this.driftAngle) * 5;
            }

            draw(ctx, centerX, centerY) {
                const x = centerX + this.x;
                const y = centerY + this.y;
                const alpha = 0.5 + 0.5 * Math.sin(time * 0.02 + this.phase);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotationAngle * 0.5);

                const char = this.text;
                ctx.font = `${this.size}px Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 20;
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
                ctx.fillText(char, 0, 0);

                ctx.restore();
            }
        }

        // ============================================
        // የልብ ዙሪያ "I LOVE YOU" Particles መፍጠር
        // ============================================
        const heartScale = Math.min(canvas.width, canvas.height) * 0.15;
        const points = generateHeartPoints(numPoints, heartScale);
        const textParticles = [];

        // በልብ ዙሪያ ላይ "I LOVE YOU" የሚሉ ጽሁፎች
        for (let i = 0; i < numPoints; i++) {
            const p = points[i];
            const hue = (i / numPoints) * 60 + 320; // ከሮዝ እስከ ቀይ
            const size = 10 + (Math.sin(i * 0.3) * 4);
            textParticles.push(new TextParticle(
                p.x, p.y,
                "I LOVE YOU",
                size,
                hue
            ));
        }

        // ============================================
        // የልብ ውስጥ ሌሎች ፊደላት
        // ============================================
        const innerParticles = [];
        for (let i = 0; i < 120; i++) {
            const p = new InnerParticle();
            // የተለያዩ ፊደላት እንዲኖሩ
            const chars = ["I", "L", "O", "V", "E", "Y", "U", "❤", "♥", "💕", "💖"];
            p.text = chars[Math.floor(Math.random() * chars.length)];
            p.size = 6 + Math.random() * 16;
            innerParticles.push(p);
        }

        // ============================================
        // የልብ መሃል ላይ የሚታየው ትልቅ ጽሁፍ
        // ============================================
        class CenterText {
            constructor() {
                this.hue = 340;
                this.pulse = 0;
            }

            update() {
                this.pulse = Math.sin(time * 0.03) * 0.15 + 1;
            }

            draw(ctx, centerX, centerY) {
                const scale = heartScale * 0.35 * this.pulse;
                const hue = 340 + 20 * Math.sin(time * 0.01);

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(Math.sin(time * 0.005) * 0.1);

                // ብርሀን ዙሪያ
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, scale * 2);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, 0)`);
                gradient.addColorStop(0.5, `hsla(${hue}, 100%, 60%, 0.1)`);
                gradient.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, scale * 2, 0, Math.PI * 2);
                ctx.fill();

                // ዋናው ጽሁፍ "I LOVE YOU"
                const fontSize = Math.min(canvas.width, canvas.height) * 0.06;
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // ብዙ ብርሀን ሽፋኖች (glow layers)
                for (let i = 3; i >= 0; i--) {
                    ctx.shadowColor = `hsl(${hue + i * 10}, 100%, 60%)`;
                    ctx.shadowBlur = 30 + i * 20;
                    ctx.fillStyle = `hsla(${hue + i * 10}, 100%, ${70 + i * 5}%, ${0.3 + i * 0.15})`;
                    ctx.fillText("I LOVE YOU", 0, 0);
                }

                // የመጨረሻ ነጭ ንብርብር
                ctx.shadowBlur = 0;
                ctx.fillStyle = `hsla(0, 0%, 100%, 0.9)`;
                ctx.fillText("I LOVE YOU", 0, 0);

                ctx.restore();
            }
        }

        const centerText = new CenterText();

        // ============================================
        // ከበስተጀርባ የሚበሩ ኮከቦች (background stars)
        // ============================================
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.alpha = Math.random();
                this.speed = 0.005 + Math.random() * 0.01;
            }

            update() {
                this.alpha += (Math.random() - 0.5) * 0.02;
                this.alpha = Math.max(0.1, Math.min(1, this.alpha));
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push(new Star());
        }

        // ============================================
        // የሚወድቁ ልቦች (falling hearts in background)
        // ============================================
        class FallingHeart {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -50;
                this.size = 5 + Math.random() * 15;
                this.speed = 0.5 + Math.random() * 1.5;
                this.hue = 320 + Math.random() * 40;
                this.alpha = 0.3 + Math.random() * 0.4;
                this.swing = Math.random() * 2;
                this.swingSpeed = 0.01 + Math.random() * 0.02;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y * this.swingSpeed) * this.swing;
                if (this.y > canvas.height + 50) {
                    this.reset();
                    this.y = -50;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.y * 0.01) * 0.3);

                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.fillText("❤", 0, 0);

                ctx.restore();
            }
        }

        const fallingHearts = [];
        for (let i = 0; i < 15; i++) {
            const h = new FallingHeart();
            h.y = Math.random() * canvas.height;
            fallingHearts.push(h);
        }

        // ============================================
        // ዋና አኒሜሽን ሉፕ
        // ============================================
        function animate() {
            time++;
            rotationAngle += 0.005; // የልብ መሽከርከር ፍጥነት

            // ካንቫሱን አፅዳ
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // ኮከቦችን ሳል
            stars.forEach(star => {
                star.update();
                star.draw(ctx);
            });

            // የሚወድቁ ልቦች
            fallingHearts.forEach(h => {
                h.update();
                h.draw(ctx);
            });

            // የልብ ዙሪያ "I LOVE YOU" ጽሁፎችን አዘምን እና ሳል
            textParticles.forEach(p => {
                p.update(time);
                p.draw(ctx, centerX, centerY);
            });

            // የልብ ውስጥ ያሉ ጽሁፎች
            innerParticles.forEach(p => {
                p.update(heartScale);
                p.draw(ctx, centerX, centerY);
            });

            // የመሃል ትልቅ ጽሁፍ
            centerText.update();
            centerText.draw(ctx, centerX, centerY);

            requestAnimationFrame(animate);
        }

        // አኒሜሽኑን ጀምር
        animate();

        // ስክሪኑ ሲቀየር እንደገና ማስተካከል
        window.addEventListener('resize', () => {
            resizeCanvas();
            // ኮከቦችን እንደገና አስቀምጥ
            stars.forEach(star => {
                star.x = Math.random() * canvas.width;
                star.y = Math.random() * canvas.height;
            });
        });

        console.log("❤️ I LOVE YOU - Heart Animation ተጀምሯል!");
    </script>
</body>
</html>
